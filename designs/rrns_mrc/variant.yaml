name: rrns_mrc
pdk: sky130A

top_module: rrns_top_mrc

clock:
  port: clk
  mode: auto
  max_ns_cap: 100

sources:
  - src/rrns_cu.v
  - src/rrns_encoder.v
  - src/rrns_slice.v
  - src/rrns_mrc_recon.v
  - src/rrns_corrector_mrc.v
  - src/rrns_top_mrc.v

precheck:
  icarus:
    enabled: true
    testbench_top: tb_rrns_top_mrc
    testbench_sources:
      - tb/**/*.v
      - tb/**/*.sv
    vcd_name: mrc_rtl_precheck.vcd
    stop_on_fail: true

  yosys:
    enabled: true
    stop_on_fail: true
    mode: structural

fp:
  core_util: 40

ll_policy:
  sdc: ../_shared/ll_policy/constraints.sdc
  power_fair_tcl: ../_shared/ll_policy/power_fair.tcl
  power_activity_tcl: ../_shared/ll_policy/power_activity.tcl
  gpl_cell_padding: 2